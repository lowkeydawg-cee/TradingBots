[project]
name = "riskbot"
version = "2.0.0"
description = "Async risk-governance and logging bot for crash-style game feeds (mock feed only)"
requires-python = ">=3.11"
dependencies = ["aiosqlite>=0.20", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["riskbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
